name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # TEMPORAL — rama de usar y tirar para comprobar que el job `ci` se pone
      # en rojo cuando `check` falla. Esta rama se borra tras la comprobación.
      - name: Forzar fallo
        run: exit 1

      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # node-pty compiles native code; build tools are preinstalled on
      # ubuntu-latest (build-essential + python3).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm --filter web lint

      - name: Typecheck (server)
        run: pnpm --filter server exec tsc -p tsconfig.json --noEmit

      - name: Test
        run: pnpm test

      # `web build` runs `tsc -b && vite build`, so it also typechecks the web app.
      - name: Build (web)
        run: pnpm --filter web build

  # The merge gate: one check name shared across every RumboLabs repo.
  #
  # This job runs nothing of its own. It exists so the organization ruleset can
  # require a single context — `ci` — everywhere, instead of one rule per repo.
  # GitHub has no "all checks must pass" option: `required_status_checks` is a
  # list of literal names, and the one rule that would avoid naming them
  # (`workflows`) is Enterprise Cloud only.
  #
  # `if: always()` is load-bearing: without it a failing `check` would leave
  # this job unexecuted, the required check would never report, and the PR
  # would hang on "Expected — Waiting for status to be reported" instead of
  # failing. The job must always run; the step below is what decides.
  ci:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify previous jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required check did not pass — see the jobs above."
          exit 1
